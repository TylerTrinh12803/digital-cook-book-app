<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page:start -->
<title>PDF Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — header, tool strip, context bar, then page list + scrolling desk of pages */
:root{
  --bg:#e4e7ec; --panel:#f8f9fb; --raise:#ffffff; --ink:#17202d; --muted:#5a6476; --line:#d2d7df;
  --accent:#2852b8; --accent-ink:#ffffff; --accent-soft:#dde5f8; --danger:#b42f2f; --shadow:rgba(16,24,40,.16);
  --sel:#2f6bff; --tbox:rgba(40,82,184,.10);
  --ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111419; --panel:#191d25; --raise:#222833; --ink:#e5e8ee; --muted:#98a1b2; --line:#2c333f;
  --accent:#86a5f5; --accent-ink:#0d1324; --accent-soft:#233152; --danger:#f07a7a; --shadow:rgba(0,0,0,.55);
  --sel:#7da2ff; --tbox:rgba(134,165,245,.16); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111419; --panel:#191d25; --raise:#222833; --ink:#e5e8ee; --muted:#98a1b2; --line:#2c333f;
  --accent:#86a5f5; --accent-ink:#0d1324; --accent-soft:#233152; --danger:#f07a7a; --shadow:rgba(0,0,0,.55);
  --sel:#7da2ff; --tbox:rgba(134,165,245,.16); color-scheme:dark; }

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--ui);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:26px;height:30px;flex:none}
.brand h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.file{display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted);font-size:13px}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{flex:none;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:var(--raise);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.only-narrow{display:none}

/* tool strip */
.tools{display:flex;align-items:center;gap:4px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:6px 6px 5px;border:1px solid transparent;border-radius:8px;background:none;color:var(--muted);font-size:11.5px}
.tool svg{width:21px;height:21px}
.tool:hover{color:var(--ink);background:var(--raise)}
.tool[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.sep{flex:none;width:1px;height:34px;background:var(--line);margin:0 6px}
.spacer{flex:1 0 8px}
.icon-btn{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:7px;border:1px solid transparent;background:none;color:var(--ink)}
.icon-btn:hover:not(:disabled){background:var(--raise);border-color:var(--line)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:19px;height:19px}
.zoom{flex:none;font:500 12px var(--mono);min-width:48px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}

/* context bar */
.props{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;min-height:46px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);border-bottom:1px solid var(--line);font-size:13px}
.props .hint{color:var(--muted)}
.props .what{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;align-items:center;gap:6px;color:var(--muted)}
.field select,.field input[type=number]{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--raise);padding:0 6px}
.field input[type=number]{width:64px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.field input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
.unit{font:12px var(--mono)}
.tog{width:32px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.swatches{display:flex;gap:4px}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.btn.small{height:30px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--danger)}

/* main */
.main{flex:1;min-height:0;display:flex;position:relative}
.side{width:176px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
.side-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 6px;font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.thumbs{flex:1;overflow-y:auto;padding:4px 14px 12px;display:flex;flex-direction:column;gap:14px}
.thumb{display:flex;flex-direction:column;align-items:center;gap:6px}
.thumb .tb{position:relative;border:2px solid transparent;border-radius:4px;padding:0;background:none;line-height:0}
.thumb.active .tb{border-color:var(--accent)}
.thumb .frame{position:relative;background:#fff;box-shadow:0 1px 3px var(--shadow);overflow:hidden}
.thumb .frame>div{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff}
.thumb canvas{width:100%;height:100%;display:block}
.thumb .row{display:flex;align-items:center;gap:2px}
.thumb .num{font:12px var(--mono);color:var(--muted);min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.thumb .row button{width:26px;height:26px;display:grid;place-items:center;border:none;border-radius:5px;background:none;color:var(--muted)}
.thumb .row button:hover:not(:disabled){background:var(--raise);color:var(--ink)}
.thumb .row button:disabled{opacity:.3;cursor:default}
.thumb .row svg{width:15px;height:15px}
.side-foot{display:grid;gap:6px;padding:10px 14px 14px;border-top:1px solid var(--line)}
.side-foot .btn{justify-content:center;height:32px;font-size:13px}

.desk{flex:1;min-width:0;overflow:auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#pages{display:flex;flex-direction:column;align-items:center;gap:10px;width:max-content;min-width:100%}
.sheet{display:flex;flex-direction:column;align-items:center;gap:6px}
.plabel{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:12px}
.slot{position:relative;box-shadow:0 1px 2px var(--shadow),0 6px 22px var(--shadow)}
.page{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
.cv,.tl,.annots{position:absolute;inset:0}
.cv canvas{width:100%;height:100%;display:block}
.cv:empty{background:repeating-linear-gradient(0deg,transparent 0 22px,#f0f2f5 22px 24px)}
.blank .cv:empty{background:#fff}

/* text you can reword */
.tl{pointer-events:none}
.tbox{position:absolute;pointer-events:auto;cursor:text;background:var(--tbox);border-radius:2px}
.tbox:hover{outline:1.5px solid var(--sel);background:transparent}

/* annotations */
.annots{pointer-events:none}
.ann{position:absolute;pointer-events:auto}
.ann-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.2;cursor:move;outline:none}
.ann-text.editing{cursor:text;outline:1.5px dashed var(--sel);outline-offset:2px;user-select:text;-webkit-user-select:text;background:rgba(255,255,255,.35)}
.ann-text:empty::before{content:"Type here";color:#8a93a3}
.ann-whiteout,.ann-rect,.ann-ellipse,.ann-image{cursor:move}
.ann-highlight{mix-blend-mode:multiply;opacity:.55;cursor:move}
.ann-ellipse{border-radius:50%}
.ann-image{user-select:none;-webkit-user-drag:none}
.annots svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.annots svg .hit{pointer-events:stroke;cursor:move}
.selbox{position:absolute;pointer-events:none;border:1.5px solid var(--sel);border-radius:2px}
.handle{position:absolute;pointer-events:auto;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--sel);cursor:nwse-resize;touch-action:none}
.handle::after{content:"";position:absolute;inset:-10px}
.ann,.annots svg .hit{touch-action:none}

/* tool modes */
body.creating .page{cursor:crosshair;touch-action:none}
body.creating .ann,body.creating .annots svg .hit,body.creating .handle{pointer-events:none}
body[data-tool="text"] .page{cursor:text}
body[data-tool="edittext"] .ann:not(.ann-text),body[data-tool="edittext"] .annots svg .hit,body[data-tool="edittext"] .handle{pointer-events:none}
body[data-tool="edittext"] .ann-text{cursor:text}

/* modal */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(10,14,20,.5)}
.dialog{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:18px;display:grid;gap:12px}
.dialog h2{margin:0;font-size:16px;font-weight:600}
.dialog p{margin:0;color:var(--muted);font-size:13px}
.pad{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;aspect-ratio:5/2;max-width:100%;touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.pad .base{position:absolute;left:8%;right:8%;bottom:24%;border-bottom:1px solid #b8bfcc;pointer-events:none}
.pad .x{position:absolute;left:5%;bottom:25%;font:16px var(--ui);color:#9aa2b0;pointer-events:none}
.dlg-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dlg-row .spacer{flex:1}

/* toast + drop */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px var(--shadow)}
.drop{position:fixed;inset:10px;z-index:35;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:14px;background:color-mix(in srgb,var(--bg) 88%,transparent);font-size:16px;font-weight:500;color:var(--accent);pointer-events:none;text-align:center;padding:16px}
.busy{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:rgba(10,14,20,.25);color:#fff;font-weight:500}

@media (max-width:760px){
  .side{position:absolute;left:0;top:0;bottom:0;z-index:20;box-shadow:4px 0 24px var(--shadow);transform:translateX(-105%);transition:transform .2s ease}
  body.show-side .side{transform:none}
  .only-narrow{display:inline-flex}
  .brand h1{display:none}
  .btn .lbl-wide{display:none}
  .tool{min-width:54px}
  .desk{padding-block:16px 64px}
}
@media (prefers-reduced-motion:reduce){ .side{transition:none} }
</style>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 26 30" aria-hidden="true"><path d="M2 2h15l7 7v19H2z" fill="var(--raise)" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/><path d="M17 2v7h7" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/><path d="M6.5 15h9" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/><path d="M6.5 20h13M6.5 24h8" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/></svg>
    <h1>PDF Workbench</h1>
    <div class="file"><span id="fileName">sample-notice.pdf</span><span class="chip" id="sampleChip">Sample</span></div>
  </div>
  <button class="btn only-narrow" id="pagesBtn" type="button" aria-label="Show pages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="11" height="14" rx="1"/><path d="M9 21h10V8"/></svg></button>
  <button class="btn" id="openBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Open<span class="lbl-wide"> PDF</span></span></button>
  <button class="btn primary" id="saveBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg><span>Download</span></button>
</header>

<nav class="tools" id="tools" aria-label="Tools">
  <div id="toolBtns" style="display:contents"></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="undoBtn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="icon-btn" id="redoBtn" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <div class="sep"></div>
  <button class="icon-btn" id="zoomOut" type="button" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M8 11h6m3.5 5.5L21 20"/></svg></button>
  <button class="zoom icon-btn" id="zoomLabel" type="button" title="Fit to width" style="width:auto">100%</button>
  <button class="icon-btn" id="zoomIn" type="button" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M8 11h6m-3-3v6m6.5 2.5L21 20"/></svg></button>
  <span class="zoom" id="pageInd" title="Current page">1 / 1</span>
</nav>

<div class="props" id="props" aria-live="polite"></div>

<div class="main">
  <aside class="side" id="side" aria-label="Pages">
    <div class="side-head"><span>Pages</span><span id="pageCount">1</span></div>
    <div class="thumbs" id="thumbs"></div>
    <div class="side-foot">
      <button class="btn" id="blankBtn" type="button">+ Blank page</button>
      <button class="btn" id="mergeBtn" type="button">+ Add pages from PDF</button>
    </div>
  </aside>
  <div class="desk" id="desk"><div id="pages"></div></div>
</div>

<div class="modal" id="sigModal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="sigTitle">
    <h2 id="sigTitle">Draw your signature</h2>
    <p>Sign with your mouse, finger or stylus. It goes on the page you're looking at, and you can drag it into place.</p>
    <div class="pad"><span class="x">×</span><div class="base"></div><canvas id="sigCanvas"></canvas></div>
    <div class="dlg-row">
      <div class="swatches" id="sigInks"></div>
      <button class="btn small" id="sigClear" type="button">Clear</button>
      <button class="btn small" id="sigSaved" type="button" hidden>Use saved signature</button>
      <span class="spacer"></span>
      <button class="btn small" id="sigCancel" type="button">Cancel</button>
      <button class="btn small primary" id="sigOk" type="button">Place signature</button>
    </div>
  </div>
</div>

<div class="drop" id="drop" hidden>Drop a PDF to open it, or an image to place it on the page</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="busy" id="busy" hidden>Working…</div>

<input type="file" id="openInput" accept="application/pdf,.pdf" hidden>
<input type="file" id="mergeInput" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="imageInput" accept="image/*" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(() => {
'use strict';
// pdf.worker is loaded as a plain script above, so pdf.js runs it on the main thread (no separate worker file needed).
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = (s, r = document) => r.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const r2 = v => Math.round(v * 100) / 100;
const clone = o => JSON.parse(JSON.stringify(o));
let nid = 1;
const uid = () => 'a' + (nid++).toString(36) + Math.random().toString(36).slice(2, 6);
const DPR = () => Math.min(window.devicePixelRatio || 1, 2);

/* ---------- icons ---------- */
const ICON = {
  select: '<path d="M6 3.5 18.5 11l-5.6 1.6-2.4 5.4z"/>',
  edittext: '<path d="M3.5 7V4.5h11V7M9 4.5V17M6.5 17h5"/><path d="m14.5 19.5 5.2-5.2 1.9 1.9-5.2 5.2h-1.9z"/>',
  text: '<path d="M4.5 7.5v-3h15v3M12 4.5v15M8.5 19.5h7"/>',
  image: '<rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><circle cx="9" cy="10" r="1.7"/><path d="m3.5 17 5-4.5 4 3.5 3-2.5 5 4"/>',
  sign: '<path d="M3 16.5c2.5-6.5 5-8.5 6-5.5s-1 6 1.5 4.5 3-5 4.5-3.5-.5 4 1.5 3.5 2-2 3.5-2"/><path d="M3 20.5h18"/>',
  draw: '<path d="m4 20 1-4.5L16.5 4l3.5 3.5L8.5 19z"/><path d="m14 6.5 3.5 3.5"/>',
  highlight: '<path d="m9.5 13.5-3 3V19h2.5l3-3"/><path d="m9.5 13.5 7-7 3 3-7 7z"/><path d="M3 21h9" stroke-width="3"/>',
  whiteout: '<path d="m4 15.5 9.5-9.5 6 6-7 7H8z"/><path d="m9 10.5 6 6M8 20.5h12"/>',
  rect: '<rect x="4" y="6" width="16" height="12" rx="1"/>',
  ellipse: '<ellipse cx="12" cy="12" rx="8.5" ry="6.5"/>',
  line: '<path d="M5 19 19 5"/>',
  up: '<path d="m6 15 6-6 6 6"/>', down: '<path d="m6 9 6 6 6-6"/>',
  rotate: '<path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4v4h-4"/>',
  trash: '<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>',
};
const icon = (n, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

const TOOLS = [
  ['select', 'Select', 'v'], ['edittext', 'Edit text', 'e'], ['text', 'Add text', 't'], ['image', 'Image', 'i'],
  ['sign', 'Sign', 's'], ['draw', 'Draw', 'd'], ['highlight', 'Highlight', 'h'], ['whiteout', 'White-out', 'w'],
  ['rect', 'Box', 'r'], ['ellipse', 'Circle', 'o'], ['line', 'Line', 'l'],
];
const HINTS = {
  select: 'Click anything you added to move it. Drag the round corner handle to resize (on text, that sets where lines wrap). Click selected text again to change it.',
  edittext: 'Click any existing text on the page to reword it. The old words get covered and a text box opens in their place.',
  text: 'Click on the page where the words should go, then type.',
  draw: 'Drag on the page to draw freehand.',
  highlight: 'Drag across the words you want to highlight.',
  whiteout: 'Drag over anything to cover it up. Add text on top to replace it.',
  rect: 'Drag on the page to draw a box.',
  ellipse: 'Drag on the page to draw a circle or oval.',
  line: 'Drag on the page to draw a straight line.',

/* ---------- loading PDFs ---------- */
async function addPdf(bytes, name, replace) {

  } catch (e) {

      : `${name} couldn't be opened. It may be damaged or not a PDF.`, 6000);
    return false;
  }

    Object.values(S.images).forEach(im => URL.revokeObjectURL(im.url)); S.images = {};
    canvasCache.clear(); thumbCache.clear(); textCache.clear();
  }
  const src = S.sources.push({ bytes, doc, name }) - 1;
  const added = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const p = await doc.getPage(i);
    const [x0, y0, x1, y1] = p.view;
    added.push({ id: uid(), src, index: i - 1, origRot: p.rotate || 0, rot: 0, x0, y0, w: x1 - x0, h: y1 - y0, annots: [] });

async function editItem(pg, i, cx, cy) {

  const it = items[i]; if (!it) return;
  let name = '', bold = false, italic = false, serif = null, mono = false;
  try {
    const fo = page.commonObjs.get(it.fontName);
    name = fo.name || ''; bold = !!(fo.bold || fo.black); italic = !!fo.italic;
    if (fo.isSerifFont != null) serif = fo.isSerifFont;
    mono = !!fo.isMonospace;
  } catch (_) { /* font not loaded yet */ }
  const probe = (name + ' ' + it.fam).toLowerCase();
  if (/bold|black|heavy|semibold|demi/.test(name.toLowerCase())) bold = true;
  if (/italic|oblique/.test(name.toLowerCase())) italic = true;
  if (/courier|mono/.test(probe)) mono = true;
  if (serif == null) serif = /times|serif|georgia|garamond|roman|book|cambria|minion/.test(probe) && !/sans/.test(probe);
  const font = mono ? 'Courier' : serif ? 'Times' : 'Helvetica';
  const size = r2(it.size);
  const pad = Math.max(0.6, size * 0.06);
  const wo = { id: uid(), type: 'whiteout', color: await sampleBg(pg, it),
    x: r2(it.x - pad), y: r2(it.base - size * 0.93), w: r2(it.w + pad * 2), h: r2(size * 1.2) };
  const t = { id: uid(), type: 'text', font, size, bold, italic, color: '#000000', text: it.str, orig: it.str, pair: wo.id, auto: true,
    x: r2(it.x), y: r2(it.base - size * BASE[font]), w: r2(it.w) };
  pg.annots.push(wo, t);
  startEdit(pg, t, cx, cy);
}

/* ---------- pointer input ---------- */
function toPage(slot, pg, cx, cy) {
  const b = slot.getBoundingClientRect(), u = cx - b.left, v = cy - b.top;
  const W = pg.w * S.scale, H = pg.h * S.scale;
  let x, y;
  switch (totalRot(pg)) {
    case 90: x = v; y = H - u; break;
    case 180: x = W - u; y = H - v; break;
    case 270: x = W - v; y = u; break;
    default: x = u; y = v;
  }
  return { x: x / S.scale, y: y / S.scale };
}

$('#pages').addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  const slot = e.target.closest('.slot');
  if (!slot) { if (S.editing) finishEdit(); else if (S.sel) select(null); return; }
  if (e.target.closest('.ann.editing')) return; // let the caret move
  const pg = pageById(slot.dataset.id); if (!pg) return;
  const pt = toPage(slot, pg, e.clientX, e.clientY);
  const t = S.tool, cx = e.clientX, cy = e.clientY;
  const handle = e.target.closest('.handle'), annEl = e.target.closest('.ann'), tbox = e.target.closest('.tbox');
  if (S.editing) finishEdit();

  if (CREATE.has(t)) {
    e.preventDefault();
    const a = newAnn(t, pt);
    pg.annots.push(a); S.sel = a.id;
    drag = { mode: 'create', pg, slot, a, start: pt };
    renderLayer(pg); updatePropsBar();
    return;
  }
  if (t === 'edittext') {
    if (annEl && annEl.classList.contains('ann-text')) {
      e.preventDefault(); const a = findAnn(pg, annEl.dataset.id);
      if (a) drag = { mode: 'click', fn: () => startEdit(pg, a, cx, cy) };
    } else if (tbox) {
      e.preventDefault(); drag = { mode: 'click', fn: () => editItem(pg, +tbox.dataset.i, cx, cy) };
    } else if (S.sel) select(null);
    return;
  }
  if (handle && S.sel) {
    const a = findAnn(pg, S.sel);
    if (a) { e.preventDefault(); drag = { mode: 'resize', pg, slot, a, orig: clone(a), ob: bbox(a) }; }
    return;
  }
  if (annEl) {
    const a = findAnn(pg, annEl.dataset.id); if (!a) return;
    e.preventDefault();
    if (t === 'text' && a.type === 'text') { drag = { mode: 'click', fn: () => startEdit(pg, a, cx, cy) }; return; }
    const was = S.sel === a.id;
    if (!was) select(a.id);
    drag = { mode: 'move', pg, slot, a, orig: clone(a), start: pt, cx, cy, moved: false, was };
    return;
  }
  if (t === 'text') {
    e.preventDefault();
    const a = { id: uid(), type: 'text', ...clone(DEF.text), text: '', auto: true };
    a.x = r2(pt.x); a.y = r2(Math.max(0, pt.y - a.size * 0.6)); a.w = 40;
    pg.annots.push(a); S.sel = a.id; renderLayer(pg);
    drag = { mode: 'click', fn: () => startEdit(pg, a, null, null, true) };
    return;
  }
  if (S.sel) select(null);
});

window.addEventListener('pointermove', e => {
  if (!drag || drag.mode === 'click') return;
  const d = drag, pt = toPage(d.slot, d.pg, e.clientX, e.clientY);
  if (d.mode === 'move') {
    if (!d.moved && Math.hypot(e.clientX - d.cx, e.clientY - d.cy) < 3) return;
    d.moved = true;
    moveAnn(d.a, d.orig, pt.x - d.start.x, pt.y - d.start.y);
  } else if (d.mode === 'resize') {
    resizeAnn(d.a, d.orig, d.ob, pt);
  } else if (d.mode === 'create') {
    const a = d.a;
    if (a.type === 'draw') {
      const last = a.pts[a.pts.length - 1];
      if (Math.hypot(pt.x - last.x, pt.y - last.y) * S.scale < 1.5) return;
      a.pts.push({ x: r2(pt.x), y: r2(pt.y) });
    } else if (a.type === 'line') {
      let q = pt;
      if (e.shiftKey) { // snap to horizontal or vertical
        const p0 = a.pts[0];
        q = Math.abs(pt.x - p0.x) > Math.abs(pt.y - p0.y) ? { x: pt.x, y: p0.y } : { x: p0.x, y: pt.y };
      }
      a.pts[1] = { x: r2(q.x), y: r2(q.y) };
    } else {
      a.x = r2(Math.min(d.start.x, pt.x)); a.y = r2(Math.min(d.start.y, pt.y));
      a.w = r2(Math.abs(pt.x - d.start.x)); a.h = r2(Math.abs(pt.y - d.start.y));
    }
  }
  renderLayer(d.pg);
});
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.mode === 'click') { d.fn(); return; }
  if (d.mode === 'move') {
    if (d.moved) commit();
    else if (d.was && d.a.type === 'text') startEdit(d.pg, d.a, e.clientX, e.clientY);
    return;
  }
  if (d.mode === 'resize') { commit(); return; }
  if (d.mode === 'create') {
    const a = d.a, b = bbox(a);
    const tiny = a.type === 'draw' ? false : a.type === 'line' ? Math.hypot(b.w, b.h) < 3 : (b.w < 3 || b.h < 3);
    if (tiny) { d.pg.annots = d.pg.annots.filter(x => x !== a); S.sel = null; }
    renderLayer(d.pg); updatePropsBar(); commit();
  }
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
$('#pages').addEventListener('dblclick', e => {
  const el = e.target.closest('.ann-text'); const slot = e.target.closest('.slot');
  if (!el || !slot || el.classList.contains('editing')) return;

/* ---------- tools ---------- */
function buildTools() {
  $('#toolBtns').innerHTML = TOOLS.map(([id, label, key]) =>
    `<button class="tool" type="button" data-tool="${id}" title="${label} (${key.toUpperCase()})" aria-pressed="false">${icon(id)}<span>${label}</span></button>`).join('');
  $('#toolBtns').addEventListener('click', e => { const b = e.target.closest('.tool'); if (b) setTool(b.dataset.tool); });
}
function setTool(t) {
  if (S.editing) finishEdit();
  if (t === 'image') { $('#imageInput').click(); return; }
  if (t === 'sign') { openSig(); return; }
  const was = S.tool;
  S.tool = t;
  document.body.dataset.tool = t;
  document.body.classList.toggle('creating', CREATE.has(t));
  document.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tool === t)));
  if (CREATE.has(t) || t === 'edittext') { if (S.sel) select(null); }
  if (was === 'edittext' || t === 'edittext') S.pages.forEach(buildTextLayer);
  updatePropsBar();
}

/* ---------- context bar ---------- */
function updatePropsBar() {
  const bar = $('#props'); bar.textContent = '';
  const a = selAnn();
  const type = a ? a.type : TOOL_TYPE[S.tool];
  const target = a || DEF[type];
  const add = el => bar.append(el);
  const label = txt => { const s = document.createElement('span'); s.className = 'what'; s.textContent = txt; return s; };
  const apply = (key, val, final) => {
    target[key] = val;
    if (a) { DEF[a.type][key] = val; const pg = pageOfAnn(a.id); renderLayer(pg); if (final) commit(); }
  };
  const field = (txt, ...kids) => { const f = document.createElement('label'); f.className = 'field'; if (txt) f.append(txt); f.append(...kids); return f; };
  const color = (key, txt, swatches) => {
    const wrap = document.createElement('div'); wrap.className = 'field';
    if (txt) wrap.append(txt);
    if (swatches) {
      const sw = document.createElement('div'); sw.className = 'swatches';
      swatches.forEach(c => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'sw'; b.style.background = c;
        b.setAttribute('aria-label', 'Color ' + c); b.setAttribute('aria-pressed', String(target[key] === c));
        b.onclick = () => { apply(key, c, true); updatePropsBar(); };
        sw.append(b);
      });
      wrap.append(sw);
    }
    const inp = document.createElement('input'); inp.type = 'color'; inp.id = 'p-' + key; inp.value = target[key] || '#ffffff';
    inp.setAttribute('aria-label', (txt || 'Color') + ' picker');
    inp.oninput = () => apply(key, inp.value, false);
    inp.onchange = () => { apply(key, inp.value, true); updatePropsBar(); };
    wrap.append(inp);
    return wrap;
  };
  const num = (key, txt, min, max, step, unit) => {
    const inp = document.createElement('input'); inp.type = 'number'; inp.id = 'p-' + key;
    inp.min = min; inp.max = max; inp.step = step; inp.value = target[key];
    inp.onchange = () => { const v = Math.min(max, Math.max(min, parseFloat(inp.value) || target[key])); inp.value = v; apply(key, v, true); };
    const u = document.createElement('span'); u.className = 'unit'; u.textContent = unit;
    return field(txt, inp, u);
  };
  const toggle = (key, txt, title, style) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tog'; b.textContent = txt; b.title = title;
    b.style.cssText = style; b.setAttribute('aria-pressed', String(!!target[key]));
    b.onclick = () => { apply(key, !target[key], true); updatePropsBar(); };
    return b;
  };

  if (!type) { const h = document.createElement('span'); h.className = 'hint'; h.textContent = HINTS[S.tool] || ''; add(h); return; }
  add(label(a ? TYPE_NAME[type] : TOOLS.find(x => x[0] === S.tool)[1]));
  if (type === 'text') {
    const sel = document.createElement('select'); sel.id = 'p-font';
    [['Helvetica', 'Sans'], ['Times', 'Serif'], ['Courier', 'Mono']].forEach(([v, l]) => { const o = new Option(l, v); o.selected = target.font === v; sel.append(o); });
    sel.onchange = () => apply('font', sel.value, true);
    add(field('Font', sel));
    add(num('size', 'Size', 4, 144, 0.5, 'pt'));
    const bi = document.createElement('div'); bi.className = 'field';
    bi.append(toggle('bold', 'B', 'Bold', 'font-weight:700'), toggle('italic', 'I', 'Italic', 'font-style:italic;font-family:Georgia,serif'));
    add(bi);
    add(color('color', '', INKS));
  } else if (type === 'draw' || type === 'line') {
    add(color('color', '', INKS));
    add(num('width', 'Width', 0.5, 20, 0.5, 'pt'));
  } else if (type === 'rect' || type === 'ellipse') {
    add(color('color', 'Line', INKS));
    add(num('width', 'Width', 0, 20, 0.5, 'pt'));
    const fb = document.createElement('div'); fb.className = 'field';
    const chk = document.createElement('input'); chk.type = 'checkbox'; chk.id = 'p-fillon'; chk.checked = !!target.fill;
    chk.onchange = () => { apply('fill', chk.checked ? '#fff3b0' : '', true); updatePropsBar(); };
    const l = document.createElement('label'); l.htmlFor = 'p-fillon'; l.textContent = 'Fill';
    fb.append(chk, l); add(fb);
    if (target.fill) add(color('fill', ''));
  } else if (type === 'highlight') {
    add(color('color', '', HL));
  } else if (type === 'whiteout') {
    add(color('color', 'Cover color'));
  }
  if (a) {
    const sp = document.createElement('span'); sp.className = 'spacer'; add(sp);
    const dup = document.createElement('button'); dup.className = 'btn small'; dup.type = 'button'; dup.textContent = 'Duplicate';
    dup.onclick = () => duplicateAnn(a.id);
    const del = document.createElement('button'); del.className = 'btn small danger'; del.type = 'button'; del.textContent = 'Delete';
    del.onclick = () => removeAnn(a.id);
    add(dup); add(del);
  } else {
    const h = document.createElement('span'); h.className = 'hint'; h.textContent = HINTS[S.tool] || ''; add(h);
  }
}

/* ---------- images & signatures ---------- */
function visiblePage() {
  const r = $('#desk').getBoundingClientRect();
  let best = null, bv = -Infinity;
  document.querySelectorAll('.slot').forEach(s => {
    const b = s.getBoundingClientRect();
    const v = Math.min(b.bottom, r.bottom) - Math.max(b.top, r.top);
    if (v > bv) { bv = v; best = s; }
  });
  return best ? pageById(best.dataset.id) : S.pages[0];
}
function loadImg(url) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; }); }
async function addImageBlob(blob, opts = {}) {
  let url = URL.createObjectURL(blob), im;
  try { im = await loadImg(url); } catch (_) { URL.revokeObjectURL(url); toast("That image couldn't be read. Try a PNG or JPG."); return; }
  let kind = blob.type === 'image/png' ? 'png' : blob.type === 'image/jpeg' ? 'jpg' : null;
  let bytes, w = im.naturalWidth, h = im.naturalHeight;
  const MAX = 3000;
  if (!kind || Math.max(w, h) > MAX) {
    const k = Math.min(1, MAX / Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const out = kind === 'jpg' ? 'image/jpeg' : 'image/png';
    const b2 = await new Promise(r => c.toBlob(r, out, 0.92));
    URL.revokeObjectURL(url); url = URL.createObjectURL(b2);
    bytes = new Uint8Array(await b2.arrayBuffer()); kind = kind === 'jpg' ? 'jpg' : 'png'; w = c.width; h = c.height;
  } else bytes = new Uint8Array(await blob.arrayBuffer());
  const imgId = uid();
  S.images[imgId] = { bytes, kind, url };
  const pg = visiblePage(); if (!pg) return;
  const ww = opts.width || Math.min(w * 0.75, pg.w * 0.5), hh = ww * h / w;
  const a = { id: uid(), type: 'image', img: imgId, w: r2(ww), h: r2(hh), x: r2((pg.w - ww) / 2), y: r2(opts.y != null ? opts.y * pg.h : (pg.h - hh) / 2) };
  pg.annots.push(a);
  if (S.tool !== 'select') setTool('select');
  select(a.id); commit();
  toast(opts.msg || 'Image added. Drag it into place, or drag the corner handle to resize.');
}

const sig = { ink: '#0b1f5c', drawing: false, has: false, last: null };
function openSig() {
  $('#sigModal').hidden = false;
  const c = $('#sigCanvas'), r = c.getBoundingClientRect();
  c.width = Math.round(r.width * DPR()); c.height = Math.round(r.height * DPR());
  sig.has = false;
  let saved = null; try { saved = localStorage.getItem('pdfwb.signature'); } catch (_) { saved = null; }
  $('#sigSaved').hidden = !saved;
  renderInks();
}
function renderInks() {
  $('#sigInks').innerHTML = ['#0b1f5c', '#000000', '#1d4ed8'].map(c => `<button type="button" class="sw" style="background:${c}" data-ink="${c}" aria-label="Ink ${c}" aria-pressed="${sig.ink === c}"></button>`).join('');
}
$('#sigInks').addEventListener('click', e => { const b = e.target.closest('[data-ink]'); if (b) { sig.ink = b.dataset.ink; renderInks(); } });
const closeSig = () => { $('#sigModal').hidden = true; };
(() => {
  const c = $('#sigCanvas'), ctx = c.getContext('2d');
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.addEventListener('pointerdown', e => { e.preventDefault(); c.setPointerCapture(e.pointerId); sig.drawing = true; sig.last = pos(e); ctx.beginPath(); ctx.fillStyle = sig.ink; ctx.arc(sig.last[0], sig.last[1], 1.4 * DPR(), 0, 7); ctx.fill(); sig.has = true; });
  c.addEventListener('pointermove', e => {
    if (!sig.drawing) return;
    const p = pos(e);
    ctx.strokeStyle = sig.ink; ctx.lineWidth = 2.6 * DPR(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(sig.last[0], sig.last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); sig.last = p;
  });
  const up = () => { sig.drawing = false; };
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  $('#sigClear').onclick = () => { ctx.clearRect(0, 0, c.width, c.height); sig.has = false; };
  $('#sigCancel').onclick = closeSig;
  $('#sigModal').addEventListener('pointerdown', e => { if (e.target.id === 'sigModal') closeSig(); });
  $('#sigSaved').onclick = async () => {
    let saved = null; try { saved = localStorage.getItem('pdfwb.signature'); } catch (_) { saved = null; }
    if (!saved) return;
    closeSig();
    const blob = await (await fetch(saved)).blob();
    addImageBlob(blob, { width: 150, y: 0.7, msg: 'Signature added. Drag it onto the signature line.' });
  };
  $('#sigOk').onclick = async () => {
    if (!sig.has) { toast('Draw your signature in the box first.'); return; }
    // Trim to the ink so the signature box hugs the strokes.
    const d = ctx.getImageData(0, 0, c.width, c.height).data;
    let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    const m = 6 * DPR(); x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(c.width - 1, x1 + m); y1 = Math.min(c.height - 1, y1 + m);
    const t = document.createElement('canvas'); t.width = x1 - x0 + 1; t.height = y1 - y0 + 1;
    t.getContext('2d').drawImage(c, x0, y0, t.width, t.height, 0, 0, t.width, t.height);
    try { localStorage.setItem('pdfwb.signature', t.toDataURL('image/png')); } catch (_) { /* storage unavailable */ }
    const blob = await new Promise(r => t.toBlob(r, 'image/png'));
    closeSig();
    addImageBlob(blob, { width: Math.min(170, t.width / DPR() * 0.75), y: 0.7, msg: 'Signature added. Drag it onto the signature line.' });
  };
})();

/* ---------- pages panel ---------- */
const TW = 116;
function getThumb(pg) {
  const k = pg.src + ':' + pg.index;
  if (!thumbCache.has(k)) {
    thumbCache.set(k, (async () => {
      const p = await S.sources[pg.src].doc.getPage(pg.index + 1);
      const vp = p.getViewport({ scale: TW / Math.min(pg.w, pg.h) * DPR(), rotation: 0 });
      const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
      await p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      return c;
    })());
  }
  return thumbCache.get(k);
}
function renderThumbs() {
  const list = $('#thumbs'); list.textContent = '';
  const n = S.pages.length;
  let chain = Promise.resolve();
  S.pages.forEach((pg, i) => {
    const r = totalRot(pg), dispW = r % 180 ? pg.h : pg.w, ts = TW / dispW;
    const W = pg.w * ts, H = pg.h * ts;
    const item = document.createElement('div'); item.className = 'thumb'; item.dataset.id = pg.id;
    item.innerHTML = `<button class="tb" type="button" aria-label="Go to page ${i + 1}"><div class="frame" style="width:${r % 180 ? H : W}px;height:${r % 180 ? W : H}px"><div style="width:${W}px;height:${H}px;transform:${rotTransform(r, W, H)}"></div></div></button>
      <div class="row"><button type="button" data-act="up" title="Move up" aria-label="Move page ${i + 1} up" ${i === 0 ? 'disabled' : ''}>${icon('up')}</button><button type="button" data-act="down" title="Move down" aria-label="Move page ${i + 1} down" ${i === n - 1 ? 'disabled' : ''}>${icon('down')}</button><span class="num">${i + 1}</span><button type="button" data-act="rot" title="Rotate" aria-label="Rotate page ${i + 1}">${icon('rotate')}</button><button type="button" data-act="del" title="Delete page" aria-label="Delete page ${i + 1}" ${n === 1 ? 'disabled' : ''}>${icon('trash')}</button></div>`;
    list.append(item);
    if (pg.src >= 0) {
      const inner = item.querySelector('.frame>div');
      chain = chain.then(() => getThumb(pg)).then(c => { const cc = document.createElement('canvas'); cc.width = c.width; cc.height = c.height; cc.getContext('2d').drawImage(c, 0, 0); inner.append(cc); }).catch(() => {});
    }
  });
  markActiveThumb();
}
$('#thumbs').addEventListener('click', e => {
  const item = e.target.closest('.thumb'); if (!item) return;
  const i = S.pages.findIndex(p => p.id === item.dataset.id); if (i < 0) return;
  const act = e.target.closest('[data-act]');
  if (!act) {
    const s = slotOf(S.pages[i]); if (s) $('#desk').scrollTo({ top: s.offsetTop - 16, behavior: 'smooth' });
    document.body.classList.remove('show-side');
    return;
  }
  if (S.editing) finishEdit();
  const pg = S.pages[i];
  switch (act.dataset.act) {
    case 'up': if (i > 0) { S.pages.splice(i, 1); S.pages.splice(i - 1, 0, pg); } break;
    case 'down': if (i < S.pages.length - 1) { S.pages.splice(i, 1); S.pages.splice(i + 1, 0, pg); } break;
    case 'rot': pg.rot = (pg.rot + 90) % 360; break;
    case 'del':
      if (S.pages.length === 1) return;
      S.pages.splice(i, 1); if (S.sel && !pageOfAnn(S.sel)) S.sel = null;
      toast(`Deleted page ${i + 1}. Undo brings it back.`);
      break;
  }
  if (S.fit) S.scale = fitScale();
  renderAll(); commit();
});
$('#blankBtn').onclick = () => {
  if (S.editing) finishEdit();
  const cur = visiblePage(), i = S.pages.indexOf(cur);
  const w = cur ? (totalRot(cur) % 180 ? cur.h : cur.w) : 612, h = cur ? (totalRot(cur) % 180 ? cur.w : cur.h) : 792;
  const pg = { id: uid(), src: -1, index: 0, origRot: 0, rot: 0, x0: 0, y0: 0, w, h, annots: [] };
  S.pages.splice(i + 1, 0, pg);
  renderAll(); commit();
  const s = slotOf(pg); if (s) $('#desk').scrollTo({ top: s.offsetTop - 16, behavior: 'smooth' });
  toast(`Blank page added after page ${i + 1}`);
};
$('#mergeBtn').onclick = () => $('#mergeInput').click();
$('#pagesBtn').onclick = () => document.body.classList.toggle('show-side');

function markActiveThumb() {
  const pg = visiblePage(); if (!pg) return;
  const i = S.pages.indexOf(pg);
  $('#pageInd').textContent = `${i + 1} / ${S.pages.length}`;
  document.querySelectorAll('.thumb').forEach(t => t.classList.toggle('active', t.dataset.id === pg.id));
}
let scrollRaf = 0;
function onScroll() { if (!scrollRaf) scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; markActiveThumb(); }); }
$('#desk').addEventListener('scroll', onScroll, { passive: true });

/* ---------- zoom ---------- */
function fitScale() {
  const desk = $('#desk'), avail = desk.clientWidth - 40;
  const maxW = Math.max(...S.pages.map(p => totalRot(p) % 180 ? p.h : p.w), 1);
  return Math.max(0.3, Math.min(1.6, avail / maxW));
}
function setScale(s, fit) {
  if (S.editing) finishEdit();
  s = Math.min(4, Math.max(0.25, s));
  S.fit = !!fit;
  if (Math.abs(s - S.scale) < 0.002) { $('#zoomLabel').textContent = Math.round(S.scale * 100) + '%'; return; }
  const desk = $('#desk'), ratio = desk.scrollTop / Math.max(1, desk.scrollHeight);
  S.scale = s; canvasCache.clear();
  renderAll();
  desk.scrollTop = ratio * desk.scrollHeight;
}
const STEPS = [0.25, 0.33, 0.5, 0.67, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3, 4];
$('#zoomIn').onclick = () => setScale(STEPS.find(v => v > S.scale + 0.01) || 4);
$('#zoomOut').onclick = () => setScale([...STEPS].reverse().find(v => v < S.scale - 0.01) || 0.25);
$('#zoomLabel').onclick = () => setScale(fitScale(), true);
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.fit && !S.editing) setScale(fitScale(), true); }, 200); });

/* ---------- export ---------- */
function hexRgb(h) { const n = parseInt((h || '#000000').slice(1), 16); return PDFLib.rgb((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255); }
function wrapLines(text, font, size, maxW) {
  const out = [];
  for (const para of text.split('\n')) {
    if (!para) { out.push(''); continue; }
    let line = '';
    for (const tok of para.split(/(\s+)/)) {
      if (!tok) continue;
      const tryLine = line + tok;
      if (font.widthOfTextAtSize(tryLine, size) <= maxW || !line.trim()) {
        if (font.widthOfTextAtSize(tryLine, size) > maxW && !/^\s+$/.test(tok)) {
          // a single word wider than the box: break it by characters
          let piece = line;
          for (const ch of tok) {
            if (font.widthOfTextAtSize(piece + ch, size) > maxW && piece) { out.push(piece); piece = ''; }
            piece += ch;
          }
          line = piece;
        } else line = tryLine;
      } else {
        out.push(line.replace(/\s+$/, ''));
        line = /^\s+$/.test(tok) ? '' : tok;
      }
    }
    out.push(line.replace(/\s+$/, ''));
  }
  return out;
}
async function buildPdf() {
  const { PDFDocument, StandardFonts, degrees, LineCapStyle, BlendMode } = PDFLib;
  const out = await PDFDocument.create();
  const libs = {}, copied = {}, fonts = {}, charsets = {}, embedded = {};
  let replaced = false;
  // Copy each source's pages in one pass so shared fonts and images aren't duplicated.
  const want = {};
  S.pages.forEach(pg => { if (pg.src >= 0) (want[pg.src] = want[pg.src] || new Set()).add(pg.index); });
  for (const src of Object.keys(want)) {
    libs[src] = await PDFDocument.load(S.sources[src].bytes, { ignoreEncryption: true, updateMetadata: false });
    const idx = [...want[src]];
    const pages = await out.copyPages(libs[src], idx);
    idx.forEach((ix, k) => { copied[src + ':' + ix] = pages[k]; });
  }
  const getFont = async (fam, b, i) => {
    const name = STD[fam][(b ? 1 : 0) + (i ? 2 : 0)];
    if (!fonts[name]) { fonts[name] = await out.embedFont(StandardFonts[name]); charsets[name] = new Set(fonts[name].getCharacterSet()); }
    return [fonts[name], charsets[name]];
  };
  const used = new Set();
  for (const pg of S.pages) {
    let page;
    if (pg.src < 0) page = out.addPage([pg.w, pg.h]);
    else {
      const key = pg.src + ':' + pg.index;
      page = used.has(key) ? out.addPage((await out.copyPages(libs[pg.src], [pg.index]))[0]) : out.addPage(copied[key]);
      used.add(key);
    }
    page.setRotation(degrees(totalRot(pg)));
    const X = v => pg.x0 + v, Y = v => pg.y0 + pg.h - v;
    for (const a of pg.annots) {
      switch (a.type) {
        case 'whiteout':
          page.drawRectangle({ x: X(a.x), y: Y(a.y + a.h), width: a.w, height: a.h, color: hexRgb(a.color) }); break;
        case 'highlight':
          page.drawRectangle({ x: X(a.x), y: Y(a.y + a.h), width: a.w, height: a.h, color: hexRgb(a.color), opacity: 0.45, blendMode: BlendMode.Multiply }); break;
        case 'rect': {
          const bw = a.width, o = { x: X(a.x) + bw / 2, y: Y(a.y + a.h) + bw / 2, width: Math.max(0, a.w - bw), height: Math.max(0, a.h - bw) };
          if (bw > 0) { o.borderColor = hexRgb(a.color); o.borderWidth = bw; }
          if (a.fill) o.color = hexRgb(a.fill);
          if (bw > 0 || a.fill) page.drawRectangle(o);
          break;
        }
        case 'ellipse': {
          const bw = a.width, o = { x: X(a.x + a.w / 2), y: Y(a.y + a.h / 2), xScale: Math.max(0, (a.w - bw) / 2), yScale: Math.max(0, (a.h - bw) / 2) };
          if (bw > 0) { o.borderColor = hexRgb(a.color); o.borderWidth = bw; }
          if (a.fill) o.color = hexRgb(a.fill);
          if (bw > 0 || a.fill) page.drawEllipse(o);
          break;
        }
        case 'line':
          page.drawLine({ start: { x: X(a.pts[0].x), y: Y(a.pts[0].y) }, end: { x: X(a.pts[1].x), y: Y(a.pts[1].y) }, thickness: a.width, color: hexRgb(a.color), lineCap: LineCapStyle.Round }); break;
        case 'draw':
          page.drawSvgPath(pathD(a.pts, 1), { x: pg.x0, y: pg.y0 + pg.h, borderColor: hexRgb(a.color), borderWidth: a.width, borderLineCap: LineCapStyle.Round }); break;
        case 'image': {
          const im = S.images[a.img]; if (!im) break;
          if (!embedded[a.img]) embedded[a.img] = im.kind === 'jpg' ? await out.embedJpg(im.bytes) : await out.embedPng(im.bytes);
          page.drawImage(embedded[a.img], { x: X(a.x), y: Y(a.y + a.h), width: a.w, height: a.h });
          break;
        }
        case 'text': {
          if (!a.text) break;
          const [font, cs] = await getFont(a.font, a.bold, a.italic);
          const clean = [...a.text.replace(/\t/g, '    ')].map(ch => {
            if (ch === '\n' || cs.has(ch.codePointAt(0))) return ch;
            replaced = true; return '?';
          }).join('');
          const lines = a.auto ? clean.split('\n') : wrapLines(clean, font, a.size, a.w + 0.5);
          lines.forEach((ln, i) => {
            if (ln) page.drawText(ln, { x: X(a.x), y: Y(a.y + a.size * BASE[a.font] + i * a.size * 1.2), size: a.size, font, color: hexRgb(a.color) });
          });
          break;
        }
      }
    }
  }
  return { bytes: await out.save(), replaced };
}

const downloadsCap = (window.claude && typeof window.claude.use === 'function')
  ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : Promise.resolve(null);

async function saveFile(bytes, filename) {
  const blob = new Blob([bytes], { type: 'application/pdf' });
  if (window.claude && typeof window.claude.use === 'function') {
    const dl = await downloadsCap;
    if (!dl) { toast("Downloading isn't available in this view. Open the page in a browser tab to save files.", 6000); return false; }
    try { await dl.save({ filename, data: blob }); return true; }
    catch (e) {
      if (e && e.code === 'declined') { toast('Download cancelled'); return false; }
      if (e && e.code === 'rate_limited') { toast('A save prompt is already open. Finish that one first.'); return false; }
      toast("The file couldn't be saved here. Try again in a browser tab.", 6000); return false;
    }
  }
  const url = URL.createObjectURL(blob), link = document.createElement('a');
  link.href = url; link.download = filename; document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return true;
}
$('#saveBtn').onclick = async () => {
  if (S.editing) finishEdit();
  const btn = $('#saveBtn'); btn.disabled = true; busy(true);
  try {
    const { bytes, replaced } = await buildPdf();
    const name = S.fileName.replace(/\.pdf$/i, '') + '-edited.pdf';
    busy(false);
    if (await saveFile(bytes, name)) {
      S.dirty = false;
      toast(replaced ? `Saved ${name}. Some characters aren't in the built-in PDF fonts and were saved as "?".` : `Saved ${name}`, replaced ? 7000 : 3200);
    }
  } catch (e) {
    console.error(e);
    toast("The PDF couldn't be built. If it's password-protected, remove the password first.", 6000);
  } finally { busy(false); btn.disabled = false; }
};

/* ---------- files in ---------- */
$('#openBtn').onclick = () => $('#openInput').click();
$('#openInput').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) openFile(f); };
$('#mergeInput').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) mergeFiles(fs); };
$('#imageInput').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) addImageBlob(f); };
const isPdf = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
let dragDepth = 0;
window.addEventListener('dragenter', e => { if ([...(e.dataTransfer.types || [])].includes('Files')) { dragDepth++; $('#drop').hidden = false; } });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#drop').hidden = true; });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; $('#drop').hidden = true;
  const files = [...e.dataTransfer.files];
  const pdf = files.find(isPdf), img = files.find(f => f.type.startsWith('image/'));
  if (pdf) openFile(pdf); else if (img) addImageBlob(img);
});
window.addEventListener('paste', e => {
  if (S.editing || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); addImageBlob(item.getAsFile()); }
});

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e => {
  if (S.editing || !$('#sigModal').hidden) return;
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'd' && S.sel) { e.preventDefault(); duplicateAnn(S.sel); return; }
  if (mod) return;
  const a = selAnn();
  if (a && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); removeAnn(a.id); return; }
  if (a && e.key.startsWith('Arrow')) {
    e.preventDefault();
    const st = e.shiftKey ? 10 : 1, dx = e.key === 'ArrowLeft' ? -st : e.key === 'ArrowRight' ? st : 0, dy = e.key === 'ArrowUp' ? -st : e.key === 'ArrowDown' ? st : 0;
    moveAnn(a, clone(a), dx, dy); renderLayer(pageOfAnn(a.id)); commit(); return;
  }
  if (e.key === 'Escape') { if (S.sel) select(null); else setTool('select'); return; }
  const t = TOOLS.find(x => x[2] === k);
  if (t) { e.preventDefault(); setTool(t[0]); }
});
window.addEventListener('beforeunload', e => { if (S.dirty && !S.isSample) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- sample document ---------- */
async function makeSample() {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const d = await PDFDocument.create();
  d.setTitle('Building notice (sample)');
  const p = d.addPage([612, 792]);
  const H = await d.embedFont(StandardFonts.Helvetica), HB = await d.embedFont(StandardFonts.HelveticaBold), T = await d.embedFont(StandardFonts.TimesRoman);
  const ink = rgb(0.09, 0.12, 0.18), grey = rgb(0.42, 0.45, 0.52);
  p.drawText('SAMPLE PAGE: open your own PDF to start editing', { x: 72, y: 748, size: 8.5, font: HB, color: rgb(0.16, 0.32, 0.72) });
  p.drawText('Maple Court Apartments', { x: 72, y: 706, size: 22, font: HB, color: ink });
  p.drawText('Notice to residents', { x: 72, y: 686, size: 12, font: H, color: grey });
  p.drawLine({ start: { x: 72, y: 672 }, end: { x: 540, y: 672 }, thickness: 0.8, color: rgb(0.8, 0.82, 0.86) });
  let y = 646;
  for (const [k, v] of [['To:', 'All residents, Building B'], ['From:', 'Building office'], ['Date:', 'October 22, 2026'], ['Re:', 'Window cleaning on Tuesday, November 4']]) {
    p.drawText(k, { x: 72, y, size: 11, font: HB, color: ink }); p.drawText(v, { x: 122, y, size: 11, font: H, color: ink }); y -= 18;
  }
  y -= 14;
  const paras = [
    'Window cleaning crews will work on the north and east sides of the building on Tuesday, November 4, from 8:00 a.m. to 3:00 p.m. Please close your blinds and clear your window sills before 8:00 a.m.',
    'Keep balcony doors on those sides closed while the crews are working. If it rains, cleaning moves to Thursday, November 6, at the same times.',
    'Questions? Call the office at 555-0142 or stop by between 9:00 a.m. and 5:00 p.m., Monday through Friday.',
    'Please sign below to confirm you received this notice, and return it to the office drop box.',
  ];
  for (const para of paras) {
    for (const ln of wrapLines(para, T, 12.5, 468)) { p.drawText(ln, { x: 72, y, size: 12.5, font: T, color: ink }); y -= 17; }
    y -= 10;
  }
  y -= 40;
  p.drawLine({ start: { x: 72, y }, end: { x: 300, y }, thickness: 0.8, color: ink });
  p.drawLine({ start: { x: 340, y }, end: { x: 440, y }, thickness: 0.8, color: ink });
  p.drawText('Resident signature', { x: 72, y: y - 14, size: 9.5, font: H, color: grey });
  p.drawText('Unit', { x: 340, y: y - 14, size: 9.5, font: H, color: grey });
  return new Uint8Array(await d.save());
}

/* ---------- start ---------- */
async function start() {
  buildTools();
  setTool('select');
  try {
    await addPdf(await makeSample(), 'sample-notice.pdf', true);
    S.fileName = 'sample-notice.pdf'; S.isSample = true; updateFileLabel();
    S.scale = fitScale(); renderAll(); resetHistory();
  } catch (e) {
    console.error(e);
    $('#props').textContent = "The editor couldn't start. Check your internet connection and reload the page.";
  }
}
start();
})();
